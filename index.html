<style>
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;max-width:640px;margin:auto;padding:16px;background:#f4f6fb;color:#1d2433;line-height:1.5}
h1{color:#1a3c8b;text-align:center;font-size:1.5em;margin:6px 0 0}
h2{color:#1a3c8b;font-size:1.2em;margin:22px 0 4px}
.sous{text-align:center;color:#556;margin:0 0 8px}
button{display:block;width:100%;padding:14px;margin:8px 0;font-size:17px;border:none;border-radius:12px;background:#1a3c8b;color:#fff;text-align:left;cursor:pointer}
button.rep{background:#fff;color:#1d2433;border:2px solid #c9d3ea}
button.fait{border-color:#2e9d4f}
button.ok{background:#e3f6e8;border-color:#2e9d4f}
button.ko{background:#fde6e6;border-color:#c93a3a}
button.sec{background:#e8ecf7;color:#1a3c8b;text-align:center}
button.vert{background:#1f8a4c;text-align:center}
.duo{display:flex;gap:8px}.duo button{flex:1;text-align:center}
.carte{background:#fff;border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.carte.accent{border-left:5px solid #1a3c8b}
.carte.grand{font-size:1.6em;text-align:center;padding:30px}
.hero{display:flex;gap:16px;align-items:center}
.anneau{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(#1a3c8b calc(var(--p)*1%),#e3e8f4 0);display:grid;place-items:center}
.anneau span{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.7em;font-weight:700;color:#1a3c8b}
.anneau small{font-size:.5em}
.ligne{display:flex;align-items:center;gap:8px;margin:6px 0}.ligne>span:first-child{width:130px;font-size:.95em}
.barre{flex:1;height:10px;background:#e3e8f4;border-radius:6px;overflow:hidden}.barre i{display:block;height:100%;background:#1a3c8b}
.petit{font-size:.9em;color:#556}.fort{color:#1a3c8b;font-weight:600}
.ex{color:#2b4a9b;font-style:italic}
.expl{margin-top:10px;padding:12px;border-radius:10px;background:#f1f4fb}
.doc p{margin:.5em 0}
.mots ul,.regle ul{padding-left:20px}.regle li,.mots li{margin:5px 0}
textarea{width:100%;min-height:220px;font-size:17px;padding:12px;border-radius:12px;border:2px solid #c9d3ea;font-family:inherit}
input[type=month]{font-size:18px;padding:10px;width:100%;border-radius:10px;border:2px solid #c9d3ea}
.case{display:block;background:#fff;padding:12px;border-radius:10px;margin:6px 0}
.case input{transform:scale(1.3);margin-right:8px}
.minuteur{text-align:center;font-size:1.4em}
.modele{white-space:normal}
summary{cursor:pointer}
.jeu{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.9em;margin:6px 2px}
.badge-new{background:#fff6d6;border-left:5px solid #f0b400}
.gris{opacity:.45}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
footer{text-align:center;font-size:.8em;color:#889;margin:30px 0 10px}
</style>

<h1>Apprendre le français 🇫🇷</h1>
